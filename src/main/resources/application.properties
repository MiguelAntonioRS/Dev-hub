# Config BBDD
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Thymeleaf - Cache activado en prod para mejor rendimiento
spring.thymeleaf.cache=true

# Server
server.port=${PORT:8080}

# Logging - Nivel más restrictivo en prod
logging.level.com.devhub.opendevplatform=INFO
logging.level.org.springframework.web=INFO

# Actuator para health checks (útil en plataformas como Render/Railway)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized